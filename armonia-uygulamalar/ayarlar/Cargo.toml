[package]
name = "armonia_ayarlar"
version = "0.1.0"
edition = "2021"
description = "Armonia Ayarlar: klavye, ekran kilidi, yazıcılar, ağ, USB, sistem bilgisi"
publish = false

[[bin]]
name = "armonia-ayarlar"
path = "src/main.rs"

[dependencies]
# hukuk_hesap ile aynı egui sürümü
eframe = { version = "0.29", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
egui = "0.29"
# Çoklu UYAP güncelleme durumu (armonia-guncelle durum JSON)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
