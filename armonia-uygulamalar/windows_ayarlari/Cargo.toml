[package]
name = "armonia_windows_ayarlari"
version = "0.1.0"
edition = "2021"
description = "Armonia Windows programları: ağdaki Windows programlarını (İcramatik vb., birden fazla) ekle/düzenle/çalıştır"
publish = false

[[bin]]
name = "armonia-windows-ayarlari"
path = "src/main.rs"

[dependencies]
# ayarlar/hukuk_hesap ile ayni egui surumu
eframe = { version = "0.29", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
egui = "0.29"
