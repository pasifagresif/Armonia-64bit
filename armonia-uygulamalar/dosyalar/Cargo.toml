[package]
name = "armonia_dosyalar"
version = "0.1.0"
edition = "2021"
description = "Armonia Dosyalar: temel dosya yöneticisi (Thunar'ın yerine)"
publish = false

[[bin]]
name = "armonia-dosyalar"
path = "src/main.rs"

[dependencies]
# ayarlar/hukuk_hesap/windows_ayarlari ile ayni egui surumu
eframe = { version = "0.29", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
egui = "0.29"
