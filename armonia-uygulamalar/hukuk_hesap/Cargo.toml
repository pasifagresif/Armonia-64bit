[package]
name = "hukuk_hesap"
version = "0.1.0"
edition = "2021"
description = "Armonia Hukuk Hesaplayıcı: süre, faiz, vekalet ücreti, harç"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "hukuk_hesap"
path = "src/bin/hukuk_hesap.rs"
required-features = ["arayuz"]

[features]
default = ["arayuz"]
# Çekirdek testleri arayüzsüz derlenebilsin: cargo test --no-default-features
arayuz = ["dep:eframe", "dep:egui"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ruyap ile aynı egui sürümü
eframe = { version = "0.29", optional = true, default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
egui = { version = "0.29", optional = true }
