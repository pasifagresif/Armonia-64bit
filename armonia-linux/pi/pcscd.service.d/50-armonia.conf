# Armonia (Pi): pcscd bosta kendiliginden kapanmasin (--auto-exit yok); coker ise yeniden baslasin.
# armonia-eimza.service PartOf=pcscd.service ile onunla birlikte yeniden baslar. Claude, 2026-11-20.
[Service]
ExecStart=
ExecStart=/usr/sbin/pcscd --foreground $PCSCD_ARGS
Restart=on-failure
RestartSec=2
