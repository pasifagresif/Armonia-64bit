# Raspberry Pi deneme imaji (arm64): Adalet E-imza'nin amd64 baslaticisi ve gomulu JRE'si yerine Debian'in arm64
# OpenJDK 21'i + resmi paketten cikarilan jar (/opt/armonia/eimza/eimza-tray.jar, pi_derle.sh koyar).
# AKIS'in Linux arm64 PKCS#11 surucusu (libakisp11.so) yok; ESYA onu bulamayinca saf Java APDU yoluna gecer
# (akiscif -> javax.smartcardio -> pcscd). Pi'de gercek kartla imza 20.11.2026'da bu yolla calisti.
# JVM secenekleri resmi paketin (1.0.17, Conveyor) baslaticisindan alindi. Sart olan:
# --add-exports=jdk.crypto.cryptoki/sun.security.pkcs11.wrapper (yoksa APDU imzasi IllegalAccessError verir).
# Claude, 2026-11-20.
[Unit]
# pcscd yeniden baslarsa Java'nin PC/SC baglami olur (SCARD_E_NO_SERVICE, 20.11 Pi denemesi) -> birlikte yeniden basla
Requires=pcscd.service
After=pcscd.service
PartOf=pcscd.service

[Service]
Environment="JAVA_TOOL_OPTIONS=-Dsun.security.smartcardio.library=/usr/lib/aarch64-linux-gnu/libpcsclite.so.1"
ExecStart=
ExecStart=/usr/bin/xvfb-run -a -e /dev/stderr -s "-nolisten tcp -nolisten local -screen 0 1024x768x24" \
  /usr/lib/jvm/java-21-openjdk-arm64/bin/java \
  --add-modules=java.logging,java.management,java.desktop,java.security.jgss,jdk.crypto.cryptoki \
  --add-exports=java.desktop/com.sun.java.swing.plaf.windows=ALL-UNNAMED \
  --add-exports=jdk.crypto.cryptoki/sun.security.pkcs11.wrapper=ALL-UNNAMED \
  --add-opens=java.base/java.lang=ALL-UNNAMED \
  --add-opens=java.base/java.util=ALL-UNNAMED \
  --add-opens=java.smartcardio/sun.security.smartcardio=ALL-UNNAMED \
  -Xmx512m -Djava.net.useSystemProxies=true -Dfile.encoding=UTF-8 \
  -jar /opt/armonia/eimza/eimza-tray.jar
