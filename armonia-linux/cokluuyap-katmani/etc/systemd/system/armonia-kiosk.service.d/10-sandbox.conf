# Armonia kiosk oturumu (labwc + uyap_app) icin systemd kum havuzu. Claude, 2026-11-14.
# BILEREK KAPALI: PrivateDevices (DRM/input/USB akilli kart gerekir), MemoryDenyWriteExecute (Mesa llvmpipe JIT),
# PrivateUsers (logind oturumu), @resources filtresi (wlroots/Mesa oncelik ayari yapabilir).
[Service]
NoNewPrivileges=yes
ProtectSystem=strict
ReadWritePaths=/var/lib/armonia /run/user
PrivateTmp=yes
# ProtectHome=yes /run/user'i da kapatir (kiosk acilmaz; guvenlik-denetci K1) -> yerine:
InaccessiblePaths=-/home -/root -/srv/kasa
# Kart yalniz e-imza istemcisinden (127.0.0.1:5975); kiosk pcscd soketine dogrudan gitmez (guvenlik-denetci E-K1)
InaccessiblePaths=-/run/pcscd
LimitCORE=0
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
RestrictSUIDSGID=yes
RestrictRealtime=yes
LockPersonality=yes
KeyringMode=private
UMask=0077
SystemCallArchitectures=native
CapabilityBoundingSet=
# Faz 4'te UYAP Editoru bubblewrap ile gelince 'user' ad alani acilacak
RestrictNamespaces=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
SystemCallFilter=@system-service
SystemCallFilter=~@privileged @obsolete @mount @swap @reboot @module @raw-io @cpu-emulation @debug
SystemCallErrorNumber=EPERM

[Unit]
# Kum havuzu kaynakli bir hatada kalici "failed" yerine surekli yeniden dene
StartLimitIntervalSec=0
# USB aygit politikasi kiosk'la birlikte (guvenlik-denetci O7)
Wants=usbguard.service armonia-eimza.service
