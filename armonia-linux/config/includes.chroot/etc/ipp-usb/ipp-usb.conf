# Armonia: IPP-over-USB yazicilar yalniz bu bilgisayarin icinden (localhost) erisilir ve agda DUYURULMAZ
# (dns-sd kapali; avahi-daemon maskeli). CUPS kuyrugunu surucu.sh kurar. Claude, 2026-11-19.
[network]
  http-min-port = 60000
  http-max-port = 65535
  dns-sd = disable
  interface = loopback
  ipv6 = disable

[logging]
  device-log    = error
  main-log      = info
  console-log   = info
  max-file-size    = 256K
  max-backup-files = 2
  console-color = disable
