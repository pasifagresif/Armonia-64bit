# Armonia ag yonetimi (19.11: systemd-networkd -> NetworkManager; Wi-Fi, giris sayfali aglar, Raspberry Pi tabani).
# DNS systemd-resolved uzerinden (nftables oturum kurali yalniz 127.0.0.53'e izin verir). Claude, 2026-11-19.
[main]
dns=systemd-resolved
plugins=keyfile

[device]
wifi.scan-rand-mac-address=yes

[connection]
# Aglar arasinda izlenmeyi zorlastir: her Wi-Fi aginda ayri, sabit rastgele MAC
wifi.cloned-mac-address=stable
ethernet.cloned-mac-address=permanent

# USB ag aygitlari yonetilmez (denetim O1, 19.11): USBGuard 02/0a/e0 siniflarini reddeder ama ureticiye ozgu (ff)
# sinifli Wi-Fi/Ethernet cubuklari "sor" kuralina duser; izin verilse bile NetworkManager onlari baglamaz
# (kotu amacli aygit DHCP ile yol/DNS dagitamaz). Dahili kartlar etkilenmez.
[device-armonia-usb-ag]
match-device=interface-name:enx*;driver:r8152;driver:ax88179_178a;driver:asix;driver:cdc_ether;driver:rndis_host;driver:cdc_ncm;driver:rtl8xxxu;driver:rtl8192cu;driver:rt2800usb;driver:mt7601u;driver:mt76x0u;driver:mt76x2u;driver:mt7921u;driver:ath9k_htc;driver:carl9170;driver:rtw88_8821cu;driver:rtw88_8822bu;driver:rtw88_8723du;driver:rtw89_8852bu;driver:brcmfmac_usb
managed=0
