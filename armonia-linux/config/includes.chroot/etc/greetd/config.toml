# Armonia giris yoneticisi (greetd). Claude, 2026-11-19.
# Canli sistem: 'armonia' kullanicisi parolasiz, dogrudan masaustune girer (initial_session, yalniz ilk acilista).
# Kurulu sistemde (Calamares, A6) initial_session kaldirilir; kullanici adi + parola istenir.
# Oturum kapanir ya da cokerse default_session (metin giris ekrani) gelir; masaustunde "Oturumu kapat" yok.
[general]
# Kullanicinin yazabildigi ~/.profile girişte calistirilmasin (denetci 19.11 D9)
source_profile = false

[terminal]
vt = 1

[default_session]
command = "/usr/sbin/agreety --cmd /opt/armonia/bin/oturum.sh"
user = "_greetd"

[initial_session]
command = "/opt/armonia/bin/oturum.sh"
user = "armonia"
