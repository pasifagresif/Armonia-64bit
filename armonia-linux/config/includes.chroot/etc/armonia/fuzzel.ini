# Armonia "A" menusu (fuzzel). Claude, 2026-11-19. Yalniz fuzzel 1.8 (bookworm) ile de gecerli anahtarlar:
# 1.8 bilinmeyen anahtarda (anchor, colors.prompt) hic acilmiyor (Pi onizlemesi).
[main]
font=DejaVu Sans:size=12
prompt="Ara  "
icon-theme=Adwaita
terminal=/bin/false
layer=overlay
width=36
lines=12
horizontal-pad=16
vertical-pad=12
inner-pad=8
line-height=28
show-actions=no

[colors]
background=FAF8F4f2
text=2F2F2Fff
match=5F7A61ff
selection=7C9A7Eff
selection-text=FAF8F4ff
selection-match=FAF8F4ff
border=5F7A61ff

[border]
width=2
radius=12
