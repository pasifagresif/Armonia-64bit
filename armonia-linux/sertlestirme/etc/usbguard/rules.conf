# Armonia USBGuard kurallari — SECENEK A (SIKI) + 19.11 "takinca sor". Kullanici karari 2026-11-14:
# "yalniz klavye, fare ve e-imza okuyucu" + (2) E-Durusma icin kamera ve mikrofon/kulaklik.
# Kaynak: Gemini taslagi (C:\dev\gemini_usbguard_taslak.md) -> Claude ayiklamasi -> guvenlik-denetci (K1 duzeltildi).
# Ilk eslesen kural uygulanir (yukaridan asagi). Sinif bazli kurallar: imaj farkli bilgisayarlarda calisir,
# avukatlarin e-imza tokenlari derlemede bilinmez (generate-policy canli imajda anlamsiz).
# match-all (USBGuard >= 1.1; trixie 1.1.3): aygitin TUM arayuzleri verilen siniflardan olmali, sayi serbest
# (equals ise arayuz SAYISINI da esitler -> medya tuslu klavye, kablosuz alici, multi-TT hub reddediliyordu).
#
# BILINEN SINIR: tek arayuzlu saf HID taklidi (Rubber Ducky) sinif bazinda gercek klavyeden ayirt edilemez;
# buna karsi labwc'de hicbir kisayol yok, kiosk kabuksuz, sanal terminal yok.
# SAHA PROSEDURU: reddedilen gercek bir aygit (orn. ff sinifli eski e-imza tokeni ACR38 072f:9010, ff arayuzlu
# web kamerasi) icin `usbguard list-devices` ciktisindaki id ile 1. kuralin USTUNE ozel satir eklenir:
#   allow id 072f:9010 with-interface equals { ff:*:* }

# 2026-11-19 GUNCELLEME (kullanici karari "USB: takinca sor", plan A5): bellek, yazici, tarayici gibi aygitlar
# artik kalici reddedilmez; hicbir kurala uymayan aygit ImplicitPolicyTarget=block ile BEKLETILIR ve
# armonia-usb-sor.service masaustunde "Bu kez izin ver / Reddet" diye sorar (izin yalniz o takili kaldikca).
# Kalici ret: ag aygitlari ve HID + baska sinif birlesimi (bellek + gizli klavye gibi BadUSB).

# 1. Ag aygitlari (CDC/RNDIS ag, kablosuz/Bluetooth, CDC-Data): yeni ag arayuzu nftables kurallarini asabilir.
#    Bu siniflardan BIRINI bile iceren bilesik aygit reddedilir; sorulmaz. Ureticiye ozgu (ff) sinifli USB
#    Wi-Fi/Ethernet cubuklari burada yakalanamaz, sorulur; NetworkManager onlari yonetmez (90-armonia.conf).
reject with-interface one-of { 02:*:* 0a:*:* e0:*:* }

# 2. USB hub'lar (dis hub, klavye ici hub, anakart ici multi-TT hub)
allow with-interface match-all { 09:*:* }

# 3. Akilli kart okuyucu / e-imza tokeni (CCID, sinif 0b) — yalniz CCID arayuzleri
allow with-interface match-all { 0b:*:* }
# Cift arayuzlu (CCID + HID) token gorulurse VID:PID dogrulanarak acilacak:
# allow id XXXX:YYYY with-interface equals { 0b:*:* 03:*:* }

# 4. Klavye ve fare — yalniz HID arayuzlu (baska sinif yok); medya tuslu klavye, kablosuz alici dahil
allow with-interface match-all { 03:*:* }

# 5. E-Durusma: web kamerasi (UVC 0e), mikrofonlu kamera (0e + 01), USB kulaklik/mikrofon (01; ses dugmeleri
#    icin 01 + 03). Ses+HID bileseni sinirli bir BadUSB yuzeyidir; kabul edilen risk (kullanici karari).
allow with-interface match-all { 0e:*:* 01:*:* }
allow with-interface match-all { 01:*:* 03:*:* }

# 6. Yukaridakilere uymayan ve HID iceren her aygit (bellek + klavye, yazici + klavye...) reddedilir; sorulmaz.
reject with-interface one-of { 03:*:* }

# 7. Geri kalanlar (yigin depolama 08, yazici 07, tarayici/fotograf 06, saticiya ozgu ff, karma ef, ...)
#    icin kural YOK: ImplicitPolicyTarget=block -> aygit bekletilir, kullaniciya sorulur.
# Armonia kurallari sonu
