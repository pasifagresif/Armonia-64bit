# Armonia USBGuard servis ayari. Kaynak: Gemini taslagi -> Claude ayiklamasi -> guvenlik-denetci. 2026-11-14.
# Kurallar imajdan gelir (salt okunur, RAM'den); calisma aninda kural eklenemez (IPC yalniz root, kiosk'ta root yok).
RuleFile=/etc/usbguard/rules.conf
# Kurallarla eslesmeyen aygit: BEKLET (19.11 'takinca sor'; armonia-usb-sor.service kullaniciya sorar)
ImplicitPolicyTarget=block
# Acilista takili aygitlar da kurallardan gecer (kapat-tak-ac ile atlatma yok)
PresentDevicePolicy=apply-policy
# Anakart USB denetleyicileri (kok hub) korunur; aksi halde klavye/fare tumden kaybolabilir
PresentControllerPolicy=keep
InsertedDevicePolicy=apply-policy
# Servis durur/coker ise engellenen aygitlar kendiliginden yetkilendirilmez
RestoreControllerDeviceState=false
DeviceManagerBackend=uevent
IPCAllowedUsers=root
IPCAllowedGroups=
IPCAccessControlFiles=/etc/usbguard/IPCAccessControl.d/
# Ayni imaj farkli kasalarda/portlarda calisir
DeviceRulesWithPort=false
AuditBackend=FileAudit
AuditFilePath=/var/log/usbguard/usbguard-audit.log
HidePII=false
