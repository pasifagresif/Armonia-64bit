# Armonia: usbguard.service sertlestirme (paket birimi degistirilmez). Kaynak: Gemini taslagi -> Claude
# ayiklamasi -> guvenlik-denetci (K2, O7). 2026-11-14.
# BILEREK KAPALI: PrivateNetwork (USB uevent'leri yalniz ana ag ad alanina gelir), ProtectKernelTunables
# (/sys/bus/usb/devices/*/authorized yazilabilir kalmali).
[Unit]
# K2: kasa parolasi Plymouth'ta USB klavyeyle girilirken politika klavyeyi dusurmesin. crypttab tries=0 ->
# cryptsetup parola girilene kadar bekler; kasa bolumu yoksa device-timeout ile gecer.
# Bedeli: parola ekrani suresince USB politikasi yok (masaustu henuz calismiyor). (Kasa su an imajda yok.)
After=systemd-cryptsetup@kasa.service
# Masaustu oturumu (greetd) USB politikasi devreye girmeden baslamasin
Before=greetd.service
# O7: cokup baslatma sinirina takilirsa kalici "failed" olup politikasiz kalmasin
StartLimitIntervalSec=0
# USB veri yolu olmayan makinede (Hyper-V Gen1) daemon "loadFiles: /sys/bus/usb/devices" ile saniyede bir
# yeniden basliyordu (14 Kasim olcumu); USB yoksa denetlenecek aygit da yok
ConditionPathIsDirectory=/sys/bus/usb/devices

[Service]
ProtectSystem=strict
ReadOnlyPaths=/etc/usbguard
ReadWritePaths=-/var/log/usbguard
ProtectHome=yes
PrivateTmp=yes
RestrictAddressFamilies=AF_UNIX AF_NETLINK
NoNewPrivileges=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
MemoryDenyWriteExecute=yes
LockPersonality=yes
SystemCallArchitectures=native
UMask=0077
Restart=always
RestartSec=1
