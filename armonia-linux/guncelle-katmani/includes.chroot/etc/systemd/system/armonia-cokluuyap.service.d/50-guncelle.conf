# Armonia guncelleme katmani (0230): Coklu UYAP guncellenmis surumle acilabilir (cokluuyap_calistir.sh ->
# armonia-guncelle etkin-sec). Claude, 2026-11-24.
[Unit]
# Baslatma siniri asilip birim 'failed' olursa bu acilis icin imajdaki surume don (kalici degil)
OnFailure=armonia-guncelle-imaja-don.service

[Service]
# Uygulama ici guncelleyici Linux'ta kendini kurmaz; yalniz "Ayarlar -> Guncellemeler" der
Environment=ARMONIA_GUNCELLEME=sistem
# Dogrulanmamis (indirilmis, henuz kurulmamis) paket kum havuzunda gorunmesin
InaccessiblePaths=-/var/lib/armonia-guncelle/gelen
