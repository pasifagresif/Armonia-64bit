# Armonia guncelleme dizinleri: sahiplik acikca (ic ice StateDirectory farkli kullanicilarda sahipligi ezer;
# denetci 24.11 O1). Ust dizin root'a ait: kurucu 'gelen'i, indirici 'cokluuyap'i degistiremez.
d /var/lib/armonia-guncelle            0755 root                    root                    -
d /var/lib/armonia-guncelle/cokluuyap  0755 armonia-guncelle        armonia-guncelle        -
d /var/lib/armonia-guncelle/durum      0755 armonia-guncelle        armonia-guncelle        -
# setgid (2750): indiricinin yazdığı dosyalar armonia-guncelle grubunda olsun, kurucu okuyabilsin (denetçi 24.11 K-1)
d /var/lib/armonia-guncelle/gelen      2750 armonia-guncelle-indir  armonia-guncelle        -
d /run/armonia-guncelle                0755 armonia-guncelle-indir  armonia-guncelle-indir  -
d /run/armonia-guncelle-don            0755 armonia-guncelle        armonia-guncelle        -
