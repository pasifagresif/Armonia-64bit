# Armonia: Çoklu UYAP'ı imzalı paketle güncelleme (plan: docs/claude-notlar/planlar/cokluuyap-linux-guncelleme.md).
# Claude, 2026-11-24.
[package]
name = "armonia-guncelle"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "armonia-guncelle"
path = "src/bin/armonia-guncelle.rs"

[dependencies]
ring = "0.17"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = { version = "0.4", default-features = false }
ruzstd = "0.8"
scrypt = { version = "0.11", default-features = false }
chacha20poly1305 = "0.10"
rpassword = "7"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
