[package]
name = "ruyap"
version = "26.11.13"
edition = "2021"
description = "Çoklu UYAP — 1:1 Rust port of Uyap Haricen Giriş"
default-run = "CokluUyap"

[lib]
name = "ruyap"
path = "src/lib.rs"

[[bin]]
name = "CokluUyap"
path = "src/main.rs"

[[bin]]
name = "uyap_app"
path = "src/bin/uyap_app.rs"

[[bin]]
name = "vendor_server"
path = "src/bin/vendor_server.rs"

[[bin]]
name = "signaling_server"
path = "src/bin/signaling_server.rs"

[[bin]]
name = "office_agent"
path = "src/bin/office_agent.rs"

[[bin]]
name = "kurucu"
path = "src/bin/kurucu.rs"

[[bin]]
name = "paket_hazirla"
path = "src/bin/paket_hazirla.rs"

[[bin]]
name = "msi_hazirla"
path = "src/bin/msi_hazirla.rs"

[[bin]]
name = "guncelleme_arac"
path = "src/bin/guncelleme_arac.rs"

[[bin]]
name = "turn_dogrula"
path = "src/bin/turn_dogrula.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "multipart", "stream", "blocking", "rustls-tls", "gzip"] }
axum = { version = "0.7", features = ["ws", "multipart", "macros"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures = "0.3"
futures-util = "0.3"
bytes = "1"
http = "1"
url = "2"
urlencoding = "2"
percent-encoding = "2"
base64 = "0.22"
hex = "0.4"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
time = "0.3"
regex = "1"
once_cell = "1"
parking_lot = "0.12"
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive", "env"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
quick-xml = "0.36"
roxmltree = "0.20"
encoding_rs = "0.8"
libloading = "0.8"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
postgres = { version = "0.19", features = ["with-serde_json-1", "with-chrono-0_4"] }
eframe = "0.29"
egui = "0.29"
webrtc = "0.12"
x509-parser = "0.16"
aes-gcm = "0.10"
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "rustls-tls"] }
subtle = "2"
data-encoding = "2"

[target.'cfg(target_os = "linux")'.dependencies]
# Armonia: stdout/stderr'i Kontrol Ekranı günlüğüne de akıtmak için (pipe/dup2). Cargo.lock'ta zaten var.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Bildirim alanı (tepsi) simgesi + menüsü — yalnız Windows (Armonia/Linux etkilenmez). 2026-11-14.
tray-icon = "0.26"
# Windows paylaşım penceresi (UDF dahil her tür; src/paylas_win.rs). Sürüm Cargo.lock'ta zaten var. 2026-11-16.
windows = { version = "0.58", features = [
    "implement",
    "Foundation",
    "Foundation_Collections",
    "ApplicationModel_DataTransfer",
    "Storage",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.59", features = [
    "Win32_Security_Cryptography",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
] }
