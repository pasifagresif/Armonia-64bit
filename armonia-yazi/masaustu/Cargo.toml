[package]
name = "armonia-yazi"
version = "0.1.0"
edition = "2021"
description = "Armonia Yazı masaüstü uygulaması (Tauri): editör arayüzü + dosya pencereleri + imza hizmeti köprüsü"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
imza = { path = "../imza" }
