[package]
name = "armonia-yazi"
version = "0.1.0"
edition = "2021"
description = "Armonia Yazı masaüstü uygulaması (Tauri): editör arayüzü + dosya pencereleri + imza hizmeti köprüsü"
publish = false

[features]
# Tauri CLI olmadan (duz cargo build) derlenince bu ozellik yoksa uygulama gomulu arayuz yerine devUrl'e
# (127.0.0.1:5180) baglanmaya calisir ve bos pencerede baglanti hatasi gosterir. derle.sh bunu acar.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
imza = { path = "../imza" }
