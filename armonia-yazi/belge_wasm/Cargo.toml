[package]
name = "belge_wasm"
version = "0.1.0"
edition = "2021"
description = "Armonia Yazı: belge çekirdeğinin tarayıcı (WebAssembly) köprüsü. Armonia'da (Tauri) ve cokluuyap.com'da aynı."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
belge_cekirdek = { path = "../belge_cekirdek", features = ["serde"] }
wasm-bindgen = "=0.2.130"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
